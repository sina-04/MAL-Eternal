services:
  - type: web
    name: mal-eternal
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: MAL_RENDER_PREVIEW
        value: "1"
      - key: NEXT_PUBLIC_MAL_RENDER_PREVIEW
        value: "1"
      - key: MAL_PREVIEW_DB_PATH
        value: /tmp/mal-eternal-preview.sqlite
      - key: MAL_COOKIE_SECURE
        value: "1"
